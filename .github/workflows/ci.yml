name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Package
        run: cargo package --locked
      - name: Help smoke test
        run: cargo run --locked -- --help
      - name: Version smoke test
        run: cargo run --locked -- --version

  windows-check:
    name: Windows compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Check Windows target
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --all-targets --target x86_64-pc-windows-gnu

  windows-test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows implementation
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked --all-targets
      - name: Build Windows release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          & target/x86_64-pc-windows-msvc/release/wsltop.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          & target/x86_64-pc-windows-msvc/release/wsltop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke test failed' }
