name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Select package version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version | select(type == "string" and length > 0)')
          tag="v${package_version}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    name: Linux x86_64
    needs: metadata
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked release binary
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p "dist/wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          cp target/release/wsltop README.md LICENSE "dist/wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu/"
          tar -C dist -czf "dist/wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" "wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          cd dist
          sha256sum "wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" > "wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: wsltop-${{ needs.metadata.outputs.tag }}-x86_64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256
  windows-x86_64:
    name: Windows x86_64
    needs: metadata
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build locked release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Smoke test executable
        run: |
          & target/x86_64-pc-windows-msvc/release/wsltop.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          & target/x86_64-pc-windows-msvc/release/wsltop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke test failed' }
      - name: Package
        run: |
          $name = "wsltop-$env:RELEASE_TAG-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wsltop.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"
      - name: Verify extracted executable
        run: |
          $name = "wsltop-$env:RELEASE_TAG-x86_64-pc-windows-msvc"
          Expand-Archive "dist/$name.zip" -DestinationPath extracted
          foreach ($file in 'wsltop.exe', 'README.md', 'LICENSE') {
            if (!(Test-Path "extracted/$name/$file")) { throw "Missing packaged $file" }
          }
          & "./extracted/$name/wsltop.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Extracted help check failed' }
          & "./extracted/$name/wsltop.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Extracted version check failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: wsltop-${{ needs.metadata.outputs.tag }}-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  verify:
    name: Verify release assets
    needs: [metadata, linux-x86_64, windows-x86_64]
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wsltop-*
          merge-multiple: true
          # Upload paths share dist/ as their root, so archive basenames land here.
          path: dist
      - name: Verify downloaded release assets
        working-directory: dist
        run: |
          for suffix in x86_64-unknown-linux-gnu.tar.gz x86_64-pc-windows-msvc.zip; do
            archive="wsltop-${RELEASE_TAG}-${suffix}"
            test -s "$archive"
            test -s "$archive.sha256"
            sha256sum --check "$archive.sha256"
          done
          tar -xzf "wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          directory="wsltop-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          test -s "$directory/README.md"
          test -s "$directory/LICENSE"
          "./$directory/wsltop" --help
          "./$directory/wsltop" --version
  publish:
    name: Publish release assets
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wsltop-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
