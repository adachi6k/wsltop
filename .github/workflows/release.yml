name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked release binary
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          cp target/release/wsltop README.md LICENSE dist/wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu/
          tar -C dist -czf dist/wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          cd dist
          sha256sum wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz > wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
