name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches package version
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Build locked release binary
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          cp target/release/wsltop README.md LICENSE dist/wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu/
          tar -C dist -czf dist/wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          cd dist
          sha256sum wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz > wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: wsltop-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify tag matches package version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          if ($env:GITHUB_REF_NAME -ne "v$($metadata.packages[0].version)") {
            throw 'Tag does not match package version'
          }
      - name: Build locked release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Smoke test executable
        run: |
          & target/x86_64-pc-windows-msvc/release/wsltop.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          & target/x86_64-pc-windows-msvc/release/wsltop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke test failed' }
      - name: Package
        run: |
          $name = "wsltop-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wsltop.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: wsltop-${{ github.ref_name }}-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  publish:
    name: Publish release assets
    needs: [linux-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wsltop-*
          merge-multiple: true
          # Upload paths share dist/ as their root, so archive basenames land here.
          path: dist
      - name: Verify downloaded release assets
        working-directory: dist
        run: |
          for suffix in x86_64-unknown-linux-gnu.tar.gz x86_64-pc-windows-msvc.zip; do
            archive="wsltop-${GITHUB_REF_NAME}-${suffix}"
            test -s "$archive"
            test -s "$archive.sha256"
            sha256sum --check "$archive.sha256"
          done
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
