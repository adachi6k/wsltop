[package]
name = "wsltop"
version = "0.5.0"
edition = "2021"
description = "Unified Windows, WSL, WSL Containers, and Docker resource monitor for WSL2"
license = "MIT"
repository = "https://github.com/adachi6k/wsltop"
readme = "README.md"
keywords = ["wsl", "wsl2", "windows", "docker", "monitor"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
bin-dir = "wsltop-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/wsltop-v{ version }-x86_64-unknown-linux-gnu.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/wsltop-v{ version }-x86_64-pc-windows-msvc.zip"
pkg-fmt = "zip"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
# Use the same word wrapping for help scroll bounds and rendering.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
