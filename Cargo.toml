[package]
name = "wsltop"
version = "0.3.0"
edition = "2021"
description = "Unified Windows, WSL, WSL Containers, and Docker resource monitor for WSL2"
license = "MIT"
repository = "https://github.com/adachi6k/wsltop"
readme = "README.md"
keywords = ["wsl", "wsl2", "windows", "docker", "monitor"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
